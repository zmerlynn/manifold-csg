# Used by scripts/check-abi.py: render the sys crate's #[repr(C)] structs and
# enums under an RS_ prefix, so static asserts can compare their layouts and
# values with the header's own types.
language = "C"
usize_is_size_t = true
no_includes = true

[export]
item_types = ["structs", "enums", "typedefs", "opaque"]
prefix = "RS_"

[enum]
prefix_with_name = true
