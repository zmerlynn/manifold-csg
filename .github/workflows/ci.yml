name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  api-coverage:
    name: API coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Catches the drift mode where a function gets bound in the sys crate
      # but API_COVERAGE.md is never updated, which left the whole ray-casting
      # surface undocumented and the Summary reporting 208 against 290.
      - run: python3 scripts/check-api-coverage.py
      # upstream-watch.yml only runs weekly, so without this a syntax error in
      # its script would ship and first surface as a red job days later.
      - run: python3 -m py_compile scripts/check-upstream.py

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('crates/manifold-csg-sys/cache-version') }}-${{ hashFiles('**/Cargo.lock', 'crates/manifold-csg-sys/build.rs', 'crates/manifold-csg-sys/build/**', 'crates/manifold-csg/build.rs') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-${{ hashFiles('crates/manifold-csg-sys/cache-version') }}-
      # nalgebra 0.35 (unconditional dev-dep) requires Rust 1.89+, so the
      # MSRV check verifies the library builds but skips tests. rust-version
      # stays 1.85 because that is the floor for the crate itself; enabling
      # the optional `nalgebra` feature inherits nalgebra's higher floor.
      - name: Build
        run: cargo build

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('crates/manifold-csg-sys/cache-version') }}-${{ hashFiles('**/Cargo.lock', 'crates/manifold-csg-sys/build.rs', 'crates/manifold-csg-sys/build/**', 'crates/manifold-csg/build.rs') }}
          restore-keys: ${{ runner.os }}-cargo-docs-${{ hashFiles('crates/manifold-csg-sys/cache-version') }}-
      - name: Doc
        run: cargo doc --no-deps --features nalgebra
        env:
          RUSTDOCFLAGS: -D warnings

  semver:
    name: Semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-semver-${{ hashFiles('crates/manifold-csg-sys/cache-version') }}-${{ hashFiles('**/Cargo.lock', 'crates/manifold-csg-sys/build.rs', 'crates/manifold-csg-sys/build/**', 'crates/manifold-csg/build.rs') }}
          restore-keys: ${{ runner.os }}-cargo-semver-${{ hashFiles('crates/manifold-csg-sys/cache-version') }}-
      - name: Check semver
        run: cargo semver-checks -p manifold-csg

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/manifold-csg-sys/cache-version') }}-${{ hashFiles('**/Cargo.lock', 'crates/manifold-csg-sys/build.rs', 'crates/manifold-csg-sys/build/**', 'crates/manifold-csg/build.rs', 'crates/manifold-csg-sys/patches/*') }}
          restore-keys: ${{ runner.os }}-cargo-${{ hashFiles('crates/manifold-csg-sys/cache-version') }}-

      - name: Build
        run: cargo build --features nalgebra

      - name: Clippy
        run: cargo clippy --all-targets --features nalgebra -- -D warnings

      - name: Test
        run: cargo test --features nalgebra

  test-no-parallel:
    name: Linux (no TBB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nopar-${{ hashFiles('crates/manifold-csg-sys/cache-version') }}-${{ hashFiles('**/Cargo.lock', 'crates/manifold-csg-sys/build.rs', 'crates/manifold-csg-sys/build/**', 'crates/manifold-csg/build.rs') }}
          restore-keys: ${{ runner.os }}-cargo-nopar-${{ hashFiles('crates/manifold-csg-sys/cache-version') }}-

      - name: Build (no parallel)
        run: cargo build --no-default-features

      - name: Test (no parallel)
        run: cargo test --no-default-features

  nix-offline:
    name: Nix (offline / prebuilt manifold)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The rust toolchain comes from the pinned nixpkgs (flake.lock), so key
      # on it: a nixpkgs bump changes rustc and must invalidate target/. No
      # cmake/clone artifacts here (the offline hatch skips both), so this is
      # purely the rust compile cache, same as the other compiling jobs.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nix-offline-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/Cargo.lock', 'crates/manifold-csg-sys/build.rs', 'crates/manifold-csg-sys/build/**', 'crates/manifold-csg/build.rs') }}
          restore-keys: ${{ runner.os }}-cargo-nix-offline-${{ hashFiles('flake.lock') }}-

      # Exercises the MANIFOLD_CSG_LIB_DIR offline hatch (issue #49): the
      # devShell links nixpkgs' prebuilt `manifold` (3.5.2, matching our pin)
      # instead of cloning + compiling manifold3d, so build.rs skips the clone
      # AND cmake. This is the only lane that covers the from-source bypass.
      - name: Build + test against prebuilt manifold
        run: nix develop --command bash -c "cargo test --features nalgebra"

  emscripten:
    name: Emscripten (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      - uses: mymindstorm/setup-emsdk@v16
        with:
          # Pin a specific emsdk version. emcc/LLVM ABI changes between
          # releases and floating "latest" makes builds non-reproducible.
          version: 5.0.7
          actions-cache-folder: emsdk-cache

      # The EMSDK path is included in the cache key because cmake bakes it
      # into target/wasm32-unknown-emscripten/.../CMakeCache.txt. Restoring
      # a target/ from a run with a different EMSDK install path makes
      # cmake panic on the now-gone toolchain file. Keying on EMSDK gives
      # each install path its own cache bucket.
      #
      # The build modules are in the restore-keys PREFIX, not just the key,
      # for the same reason: build/build.rs decides the cmake source dir that
      # gets recorded in CMakeCache.txt as an absolute path. A permissive
      # prefix would happily restore a target/ built against the old layout,
      # which is the "source does not match" failure this lane has hit before.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-emscripten-${{ env.EMSDK }}-${{ hashFiles('crates/manifold-csg-sys/cache-version') }}-${{ hashFiles('crates/manifold-csg-sys/build.rs', 'crates/manifold-csg-sys/build/**') }}-${{ hashFiles('**/Cargo.lock', 'crates/manifold-csg/build.rs') }}
          restore-keys: ${{ runner.os }}-cargo-emscripten-${{ env.EMSDK }}-${{ hashFiles('crates/manifold-csg-sys/cache-version') }}-${{ hashFiles('crates/manifold-csg-sys/build.rs', 'crates/manifold-csg-sys/build/**') }}-

      # MANIFOLD_PAR is forced off for emscripten regardless of feature flags
      # (TBB needs SharedArrayBuffer + COOP/COEP HTTP headers from the host).
      # Build with --no-default-features to reflect that and silence the warning.
      - name: Build
        run: cargo build --target wasm32-unknown-emscripten --no-default-features

      - name: Build with nalgebra
        run: cargo build --target wasm32-unknown-emscripten --no-default-features --features nalgebra

      # Run the integration tests under Node. Emscripten emits a JS shim
      # alongside the wasm; cargo's test runner config invokes it via node.
      # 11 thread-using tests are expected to be reported as ignored
      # (#[cfg_attr(target_os = "emscripten", ignore = ...)]).
      - name: Test under Node
        env:
          CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUNNER: node
        run: cargo test --target wasm32-unknown-emscripten -p manifold-csg --no-default-features --tests

  wasm32-uu:
    name: Wasm32 (unknown-unknown)
    runs-on: ubuntu-latest
    env:
      # Pinned LLVM bin dir for build.rs's find_llvm() to skip detection
      # ladder. apt.llvm.org installs the toolchain here on Debian-family.
      WASM_CXX_SHIM_LLVM_BIN_DIR: /usr/lib/llvm-20/bin
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Install LLVM 20 with libc++/libc++abi headers and lld for the
      # wasm-cxx-shim build path. The shim's toolchain file probes
      # /usr/lib/llvm-N/bin so this layout is what it expects. wabt
      # provides wasm-objdump for the import-section assertions below.
      - name: Install LLVM 20 + libc++ + lld + wabt
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-20 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-20 lld-20 libc++-20-dev libc++abi-20-dev wabt

      # Cache key splits the hash into two parts so the restore-keys
      # prefix can include the "stable" inputs (build.rs + wasm32-uu/**).
      # Those are the inputs that determine cmake's source-dir layout —
      # if either changes, a restored target/ would have a CMakeCache.txt
      # pointing at the old source dir and cmake refuses to reuse it.
      # Putting them in the restore-keys prefix means a build.rs / wrapper
      # change forces a fresh build instead of restoring an incompatible
      # cache. The "volatile" inputs (Cargo.lock, manifold-csg/build.rs)
      # change frequently but don't move the cmake source dir, so they go
      # in the suffix where a key miss can fall through to a restore.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm32-uu-${{ hashFiles('crates/manifold-csg-sys/cache-version') }}-${{ hashFiles('crates/manifold-csg-sys/build.rs', 'crates/manifold-csg-sys/build/**', 'crates/manifold-csg-sys/wasm32-uu/**') }}-${{ hashFiles('**/Cargo.lock', 'crates/manifold-csg/build.rs') }}
          restore-keys: ${{ runner.os }}-cargo-wasm32-uu-${{ hashFiles('crates/manifold-csg-sys/cache-version') }}-${{ hashFiles('crates/manifold-csg-sys/build.rs', 'crates/manifold-csg-sys/build/**', 'crates/manifold-csg-sys/wasm32-uu/**') }}-

      # Build the sys crate first to surface cmake/clang errors clearly.
      # `unstable-wasm-uu` is required by build.rs for this target.
      - name: Build manifold-csg-sys
        run: cargo build --target wasm32-unknown-unknown -p manifold-csg-sys --features unstable-wasm-uu

      - name: Build manifold-csg (with tests + examples)
        # --examples catches new examples that aren't portable to this target
        # (e.g. an OBJ-using example that needs cfg-gating).
        run: cargo build --target wasm32-unknown-unknown -p manifold-csg --no-default-features --features unstable-wasm-uu --tests --examples

      # Verify the produced test wasm has zero unexpected imports —
      # confirms the shim covered every C/C++ runtime symbol manifold needs
      # and the iostream patches successfully eliminated the OBJ I/O imports.
      - name: Verify zero imports (integration test wasm)
        run: |
          WASM=$(ls -t target/wasm32-unknown-unknown/debug/deps/integration-*.wasm | head -1)
          echo "Inspecting: $WASM"
          # wasm-objdump prints "Section not found: Import" when there's no Import section.
          if wasm-objdump -x -j Import "$WASM" 2>&1 | grep -q "Section not found"; then
            echo "✓ wasm has no Import section — clean link"
          else
            echo "✗ wasm has unexpected imports:"
            wasm-objdump -x -j Import "$WASM"
            exit 1
          fi

      # The smoke wasm was already built by the --examples step above.
      # Verify it links cleanly and runs under Node — exercises a real
      # CSG operation (cube + translated cube → boolean union → triangle
      # count) end-to-end, proving the link cocktail actually works at
      # runtime, not just at link time.
      - name: Verify zero imports (smoke example wasm)
        run: |
          WASM=target/wasm32-unknown-unknown/debug/examples/wasm32_uu_smoke.wasm
          if wasm-objdump -x -j Import "$WASM" 2>&1 | grep -q "Section not found"; then
            echo "✓ smoke wasm has no Import section"
          else
            echo "✗ smoke wasm has unexpected imports:"
            wasm-objdump -x -j Import "$WASM"
            exit 1
          fi

      - name: Run smoke under Node
        run: node crates/manifold-csg/wasm32-uu-runner/run.mjs target/wasm32-unknown-unknown/debug/examples/wasm32_uu_smoke.wasm
